<!DOCTYPE html>
<html>
<head>
<title>E-Commerce Management</title>
</head>
<body>
<h2>Product List</h2>
<a href="/add">Add Product</a>
<table border="1" cellpadding="10">
<tr>
<th>ID</th>
<th>Name</th>
<th>Price (₹)</th>
<th>Stock</th>
<th>Actions</th>
</tr>
{% for product in products %}
<tr>
<td>{{ product._id }}</td>
<td>{{ product.name }}</td>
<td>{{ product.price }}</td>
<td>{{ product.stock }}</td>
<td>
<a href="/edit/{{ product._id }}">Edit</a>
<a href="/delete/{{ product._id }}">Delete</a>
</td>
</tr>
{% endfor %}
</table>
</body>
</html>
