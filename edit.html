<!DOCTYPE html>
<html>
<head>
<title>Edit Product</title>
</head>
<body>
<h2>Edit Product</h2>
<form method="POST">
Name: <input type="text" name="name" value="{{ product.name }}" required><br><br>
Price: <input type="number" step="0.01" name="price" value="{{ product.price }}"
required><br><br>
Stock: <input type="number" name="stock" value="{{ product.stock }}" required><br><br>
<button type="submit">Update</button>
</form>
<a href="/">Back</a>
</body>
</html>
